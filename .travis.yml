language: php
php:
  - 7.2.0
before_script:
  - cp .env.travis .env
  - mysql -e 'create database homestead_test'
  - composer self-update
  - composer install --no-interaction
  - php artisan key:generate
  - php artisan migrate --step
  - php artisan db:seed
  - echo -e "Host $PRODUCTION_SERVER\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
script:
  - vendor/bin/phpunit

before_deploy:
  - openssl aes-256-cbc -K $encrypted_8664ab87a258_key -iv $encrypted_8664ab87a258_iv
    -in id_rsa_gs.enc -out id_rsa_gs -d
  - eval "$(ssh-agent -s)"
  - chmod 600 id_rsa_gs
  - ssh-add id_rsa_gs

