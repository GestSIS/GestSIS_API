name: Tests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    name: "PHPUnit"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hs
          MYSQL_USER: gestsis
          MYSQL_PASSWORD: pwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, fileinfo, mysql, gd, gmp, zip
          coverage: none

      - name: Copy .env
        run: cp .env.docker .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u gestsis -ppwd --silent; do
            sleep 2
          done

      - name: Run migrations and seed database
        run: php artisan migrate:fresh --seed --force
        env:
          DB_HOST: 127.0.0.1

      - name: Run test suite
        run: php artisan test --compact
        env:
          DB_HOST: 127.0.0.1
